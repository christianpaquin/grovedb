[package]
name = "merk-wasm"
version = "0.1.0"
edition = "2021"
authors = ["GroveDB Contributors"]
description = "WebAssembly bindings for Merk positional proof verification"

[workspace]
# This is its own workspace, not part of the parent workspace

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
grovedb-merk = { path = "../../merk", default-features = false, features = ["verify", "list_mode_verify"] }
grovedb-version = { path = "../../grovedb-version" }
grovedb-costs = { path = "../../costs" }

wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
bincode = "1.3"
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
