[package]
name = "merk-collab-auditor"
version = "0.1.0"
edition = "2021"
authors = ["GroveDB Contributors"]
description = "Auditor tool to verify Merk collaborative editing changelog"

[workspace]
# This is its own workspace, not part of the parent workspace

[dependencies]
grovedb-merk = { path = "../../merk", features = ["list_mode"] }
grovedb-version = { path = "../../grovedb-version" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"
base64 = "0.21"
hex = "0.4"
uuid = { version = "1.7", features = ["v4", "serde"] }

# CLI
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"
