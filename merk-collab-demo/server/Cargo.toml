[package]
name = "merk-collab-server"
version = "0.1.0"
edition = "2021"
authors = ["GroveDB Contributors"]
description = "Collaborative editing server using Merk with positional proofs"

[workspace]
# This is its own workspace, not part of the parent workspace

[dependencies]
grovedb-merk = { path = "../../merk", features = ["list_mode"] }
grovedb-version = { path = "../../grovedb-version" }
grovedb-costs = { path = "../../costs" }
grovedb-storage = { path = "../../storage" }
grovedb-path = { path = "../../path" }

# Web server
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.36", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
base64 = "0.21"
futures-util = "0.3"
tempfile = "3.10"

[dev-dependencies]
# No dev-specific deps needed since tempfile is now in main dependencies
